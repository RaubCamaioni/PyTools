<!DOCTYPE html>
<html lang="en">

    <head>
        {% set title = 'User Profile' %}
        {% include 'components/head.html' %}
    </head>

    <body class="bg-ink text-paper font-mono">

        {% include 'components/header.html'%}

        <div class="max-w-3xl mx-auto px-4 flex flex-col gap-6">

            <section>
                <div class="prompt font-bold mb-2">user settings</div>
                <form
                    hx-post="/manage/user/settings"
                    hx-swap="none"
                    onsubmit="event.preventDefault();"
                    class="panel p-3 flex flex-wrap items-center gap-2">
                   <label for="alias">alias:</label>
                   <input
                    class="flex-grow"
                    id="alias"
                    type="text"
                    name="alias"
                    value="{{ alias }}">
                    <button class="btn">[ save ]</button>
                </form>
            </section>

            <section>
                <div class="prompt font-bold mb-2">user tools</div>
                <ul id="tool-list">
                    {% include 'components/upload_tool_item.html'%}

                    <li
                        hx-post="{{ root_path }}/user/tools"
                        hx-trigger="load"
                        hx-swap="outerHTML"
                        class="-mt-px">
                        <span class="row text-dim">loading...</span>
                    </li>
                </ul>
            </section>
        </div>
    </body>
</html>
