<!DOCTYPE html>
<html lang="en">

    <head>
        {% set title = 'User Profile' %}
        {% include 'components/head.html' %}
    </head>

    <body class="bg-ink text-paper font-mono">

        {% set cwd = '~/tools' %}
        {% include 'components/header.html'%}

        <div class="max-w-4xl mx-auto px-4 flex flex-col gap-6">

            {# settings as a command line: $ alias <name> [ save ] #}
            <form
                hx-post="/manage/user/settings"
                hx-swap="none"
                onsubmit="event.preventDefault();"
                class="flex flex-wrap items-center gap-2 whitespace-nowrap">
               <label for="alias"><span class="text-dim">$</span> alias</label>
               <input
                class="flex-grow min-w-0 border-0 border-b border-line px-1 py-0 focus:border-paper"
                id="alias"
                type="text"
                name="alias"
                value="{{ alias }}">
                <button class="btn">[ save ]</button>
            </form>

            <section>
                <div class="prompt font-bold mb-1">ls -l tools/</div>
                <ul id="tool-list">
                    {% include 'components/upload_tool_item.html'%}

                    <li
                        hx-post="{{ root_path }}/user/tools"
                        hx-trigger="load"
                        hx-swap="outerHTML"
                        class="px-1 text-dim">...</li>
                </ul>
            </section>
        </div>
    </body>
</html>
