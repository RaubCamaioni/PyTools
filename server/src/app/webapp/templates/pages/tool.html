<!DOCTYPE html>
<html lang="en">
    <head>
        {% set title = tool %}
        {% include 'components/head.html' %}
        {% include 'components/tool_style.html' %}
        {% include 'components/code_style.html' %}
    </head>
    <body class="bg-ink text-paper font-mono">

        {% set cwd = '~/tools' %}
        {% include 'components/header.html'%}

        <div class="w-11/12 max-w-7xl mx-auto flex flex-col">

            <div class="prompt font-bold mb-2">cat {{ tool }}.py</div>
            <div class="panel flex flex-col md:flex-row">

                <div class="md:w-3/4 max-h-[700px] overflow-auto border-b md:border-b-0 md:border-r border-line">
                    <pre class="line-numbers"><code class="language-python">{{ code }}</code></pre>
                </div>

                <div class="md:w-1/4 flex flex-col p-3 gap-3">
                    <form
                        id="argument-form"
                        enctype="multipart/form-data"
                        hx-post="{{ endpoint }}"
                        hx-target="#return"
                        hx-indicator="#loading-bar"
                        hx-swap="innerHTML">

                        {{ form_groups | safe }}

                        <button
                            class="btn w-full mt-2"
                            type="submit"
                            form="argument-form">[ run ]</button>
                    </form>

                    <div class="flex flex-wrap gap-x-3 gap-y-1 text-dim">
                        <a href="{{ root_path }}/download/tool/{{ tool_id }}" class="no-underline px-1 hover:bg-paper hover:text-ink">[download]</a>
                        <button id="share-link-button" class="cursor-pointer px-1 hover:bg-paper hover:text-ink">[share link]</button>
                    </div>

                    <div class="flex-grow"></div>

                    <div class="label">runs: {{ runs }}</div>
                </div>
            </div>

            <div id="result_title" class="output font-bold mt-6 mb-2">results</div>
            <div id="loading-bar" class="loadbar" aria-hidden="true"></div>
            <div class="panel p-3 overflow-x-auto" id="result">
                <div id="return">
                    <pre></pre>
                </div>
            </div>

        </div>
        <div style="height: 200px;"></div>
        <script async>
            function copy_form_to_clipboard() {
                event.preventDefault();
                const form = document.getElementById('argument-form');
                const formData = new FormData(form);
                const queryString = new URLSearchParams(formData).toString();
                const currentUrl = new URL(window.location.href);
                currentUrl.search = queryString;
                navigator.clipboard.writeText(currentUrl.toString())
            }
            document.getElementById("share-link-button").addEventListener("click", copy_form_to_clipboard);
        </script>
        <script async type="module" src="/scripts/stl-viewer.js"></script>
    </body>
</html>
