<div class="panel p-3 w-full max-w-md mx-auto">

    <div class="prompt font-bold mb-3">upload code</div>

    <label for="file-input" class="btn">[ choose .py file ]</label>

    <input
        id="file-input"
        type="file"
        name="file"
        hx-post="/manage/tool/upload"
        hx-encoding="multipart/form-data"
        hx-trigger="change"
        hx-swap="none"
        style="display: none;" />
</div>
