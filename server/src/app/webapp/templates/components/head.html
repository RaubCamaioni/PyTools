
{# Meta #}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">

{# Styling #}
<link href="/static/output.css?v={{ static_version }}" rel="stylesheet">

{# Interactivity #}
<script src="/scripts/htmx.min.js"></script>
<script src="/scripts/_hyperscript.min.js"></script>
<script>
    // console fields size to their text, so a click anywhere on a field's rule focuses its control
    document.addEventListener("click", function (event) {
        const field = event.target.closest && event.target.closest(".field, .pick");
        if (field && !event.target.matches("input, select")) {
            const control = field.querySelector("input, select");
            if (control) {
                control.focus();
                if (control.setSelectionRange) {  // type at the end, like a prompt
                    const end = control.value.length;
                    try { control.setSelectionRange(end, end); } catch (e) {}
                }
            }
        }
    });
</script>

{# ResponseError Alert #}
<script type="text/hyperscript">
    on htmx:responseError in <body/>
        call alert(JSON.parse(event.detail.xhr.response).detail)
    end
</script>
