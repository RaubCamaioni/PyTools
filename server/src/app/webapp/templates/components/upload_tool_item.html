{# first row of the `ls -l tools/ | column -t` table: pick a .py file to add a tool. Columns that do not
   apply to a file that is not uploaded yet read n/a #}
<li class="contents">

    {# name: the picker; the label shows the chosen file name until the rows refresh #}
    <span class="px-1 py-0.5 min-w-0">
        <label id="upload-label" for="tool-upload" class="cursor-pointer px-1 hover:bg-paper hover:text-ink">[upload]</label>
        <input
            id="tool-upload"
            type="file"
            name="file"
            accept=".py"
            hx-post="{{ root_path }}/manage/tool/upload"
            hx-encoding="multipart/form-data"
            hx-trigger="change"
            hx-swap="none"
            _="on change if my.files.length > 0 set #upload-label.innerText to '[' + my.files[0].name + ']' end
               on htmx:afterRequest if event.detail.successful send refresh to #tool-rows end"
            style="display: none;" />
    </span>

    {# mode #}
    <span class="text-dim px-1 py-0.5">n/a</span>

    {# runs #}
    <span class="text-right text-dim px-1 py-0.5">n/a</span>

    {# actions #}
    <span class="text-dim px-1 py-0.5">n/a</span>
</li>
