<li class="flex flex-wrap items-center gap-x-4 gap-y-2 px-1 py-2 border-b border-line">
    <span class="text-dim"><span class="text-dim">$</span> upload</span>
    <span class="text-dim">tool.py</span>
    <div class="flex-grow"></div>
    <label for="tool-upload" class="btn">[ choose file ]</label>
    <input
        id="tool-upload"
        type="file"
        name="file"
        hx-post="{{ root_path }}/manage/tool/upload"
        hx-encoding="multipart/form-data"
        hx-trigger="change"
        hx-swap="none"
        style="display: none;" />
</li>
