<li class="-mt-px">
    <div class="row flex flex-wrap items-center gap-2">

        <span class="text-dim">upload a new tool (.py)</span>

        <div class="flex-grow"></div>

        <label for="tool-upload" class="btn">[ choose file ]</label>

        <input
            id="tool-upload"
            type="file"
            name="file"
            hx-post="{{ root_path }}/manage/tool/upload"
            hx-encoding="multipart/form-data"
            hx-trigger="change"
            hx-swap="none"
            style="display: none;" />
    </div>
</li>
