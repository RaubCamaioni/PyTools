<li class="flex items-center px-1 py-0.5 hover:bg-faint">
    <label for="tool-upload" class="cursor-pointer px-1 hover:bg-paper hover:text-ink">[ upload file ]</label>
    <input
        id="tool-upload"
        type="file"
        name="file"
        hx-post="{{ root_path }}/manage/tool/upload"
        hx-encoding="multipart/form-data"
        hx-trigger="change"
        hx-swap="none"
        style="display: none;" />
</li>
