<div class="form-group mb-2 flex items-center gap-2">

	<label
		class="block w-1/3 text-dim truncate"
		for="{{ name }}"
		title="{{ name }}">
		{{ name }}:
	</label>

	<input
		class="block w-2/3"
		required
		type="{{ type }}"
		id="{{ name }}"
		name="{{ name }}"
		value="{{ default }}"
		step=".01">
</div>
