<li class="-mt-px">
    <div class="row flex flex-wrap items-center gap-x-4 gap-y-2">

        <a href="{{ root_path }}/tool/{{ id }}" class="font-bold">{{ name }}</a>

        <div class="flex-grow"></div>

        <label class="flex items-center gap-1 text-dim">
            <input
                type="checkbox"
                {{ anonymous }}
                _="
                on change
                    toggle @checked on me
                    fetch `{{ root_path }}/manage/tool/settings/{{ id }}?anonymous=${@checked is not null}` with method:'POST'
                end"/>
            anonymous
        </label>

        <label class="flex items-center gap-1 text-dim">
            <input
                type="checkbox"
                {{ public }}
                _="
                on change
                    toggle @checked on me
                    fetch `{{ root_path }}/manage/tool/settings/{{ id }}?public=${@checked is not null}` with method:'POST'
                end"/>
            public
        </label>

        <input
            id="tool-update-{{ id }}"
            type="file"
            name="file"
            hx-post="{{ root_path }}/manage/tool/update/{{ id }}"
            hx-encoding="multipart/form-data"
            hx-trigger="change"
            hx-swap="none"
            style="display: none;" />

        <label for="tool-update-{{ id }}" class="btn">[ update ]</label>

        <a
            hx-delete="{{ root_path }}/manage/tool/delete/{{ id }}"
            hx-trigger="click"
            hx-target="closest li"
            class="btn">[ delete ]</a>

    </div>
</li>
