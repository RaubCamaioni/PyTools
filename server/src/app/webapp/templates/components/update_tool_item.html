<li class="px-1 py-0.5 hover:bg-faint">

    <div class="flex items-center">
        <span class="whitespace-pre text-dim select-none">{{ branch }}</span>
        <a href="{{ root_path }}/tool/{{ id }}" class="no-underline px-1 hover:bg-paper hover:text-ink">{{ name }}.py</a>
    </div>

    <div class="flex items-center gap-1">
        <span class="whitespace-pre text-dim select-none">{{ indent }}├── </span>
        <label class="switch">
            <input
                type="checkbox"
                {{ public }}
                _="
                on change
                    fetch `{{ root_path }}/manage/tool/settings/{{ id }}?public=${my.checked}` with method:'POST'
                end"/>
            <span class="label-text">[public]</span>
        </label>
        <label class="switch">
            <input
                type="checkbox"
                {{ anonymous }}
                _="
                on change
                    fetch `{{ root_path }}/manage/tool/settings/{{ id }}?anonymous=${my.checked}` with method:'POST'
                end"/>
            <span class="label-text">[anonymous]</span>
        </label>
    </div>

    <div class="flex items-center gap-1 text-dim">
        <span class="whitespace-pre select-none">{{ indent }}└── </span>
        <input
            id="tool-update-{{ id }}"
            type="file"
            name="file"
            hx-post="{{ root_path }}/manage/tool/update/{{ id }}"
            hx-encoding="multipart/form-data"
            hx-trigger="change"
            hx-swap="none"
            style="display: none;" />
        <label for="tool-update-{{ id }}" class="cursor-pointer px-1 hover:bg-paper hover:text-ink">[update]</label>
        <a
            hx-delete="{{ root_path }}/manage/tool/delete/{{ id }}"
            hx-trigger="click"
            hx-confirm="Delete {{ name }}.py?"
            hx-target="closest li"
            class="cursor-pointer no-underline px-1 hover:bg-paper hover:text-ink">[delete]</a>
    </div>
</li>
