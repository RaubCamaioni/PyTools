{# terminal prompt: user@host:cwd $ on the left, the bracket links on the right.
   Pages set `cwd` before including this (default ~). #}
<header class="w-full border-b border-line mb-6">
  <div class="flex flex-wrap items-center gap-x-4 gap-y-1 px-4 py-2">

    <span class="whitespace-nowrap"><span class="text-dim">{{ session_alias(request) }}@pytools</span>:{{ cwd | default('~') }}<span class="text-dim"> $</span></span>

    <div class="flex-grow"></div>

    <nav class="flex flex-wrap items-center gap-1 whitespace-nowrap">
      <a href="{{ root_path }}/" class="no-underline px-1 hover:bg-paper hover:text-ink">[home]</a>
      <a href="{{ root_path }}/privacy-policy" class="no-underline px-1 text-dim hover:bg-paper hover:text-ink">[privacy]</a>
      <a href="{{ root_path }}/terms-of-service" class="no-underline px-1 text-dim hover:bg-paper hover:text-ink">[terms]</a>
      <a href="{{ root_path }}/user" class="no-underline px-1 hover:bg-paper hover:text-ink">[profile]</a>
      <span
        class="text-dim px-1"
        hx-get="{{ root_path }}/login/button"
        hx-trigger="load"
        hx-swap="outerHTML">[login]</span>
    </nav>

  </div>
</header>
