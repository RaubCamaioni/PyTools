<header class="w-full border-b border-line mb-6">
  <div class="flex flex-wrap items-center gap-x-6 gap-y-2 px-4 py-2">

    <a href="{{ root_path }}/" class="text-paper no-underline hover:underline" title="home">~/pytools</a>

    <nav class="flex flex-wrap items-center gap-x-4 text-dim">
      <a href="{{ root_path }}/privacy-policy" class="whitespace-nowrap">privacy</a>
      <a href="{{ root_path }}/terms-of-service" class="whitespace-nowrap">terms</a>
      <span class="whitespace-nowrap">support@pywebtools.com</span>
    </nav>

    <div class="flex-grow"></div>

    <h1 class="text-paper whitespace-nowrap order-last w-full text-center sm:order-none sm:w-auto">[ {{ header_title }} ]</h1>

    <div class="flex-grow"></div>

    <div class="flex items-center gap-2">
      <a class="btn" href="{{ root_path }}/user">profile</a>
      <a
        class="btn"
        hx-get="{{ root_path }}/login/button"
        hx-trigger="load"
        hx-swap="outerHTML">
        login
      </a>
    </div>

  </div>
</header>
