<div class="form-group mb-2 flex items-center gap-2">

	<label
		class="block w-1/3 text-dim truncate"
		for="{{ name }}"
		title="{{ name }}">
		{{ name }}:
	</label>

	<select
		class="block w-2/3"
		id="{{ name }}"
		name="{{ name }}">
		{% for option in options %}
            <option value="{{ option.value }}">{{ option.label }}</option>
        {% endfor %}
	</select>
</div>
