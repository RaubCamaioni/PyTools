<link href="{{ root_path }}/static/prism-vim.css?v={{ static_version }}" rel="stylesheet">
<link href="{{ root_path }}/static/prism-line-numbers.min.css?v={{ static_version }}" rel="stylesheet">
<script src="{{ root_path }}/scripts/prism.min.js"></script>
<script src="{{ root_path }}/scripts/prism-python.min.js"></script>
<script src="{{ root_path }}/scripts/prism-line-numbers.min.js"></script>
<style>
    /* The code pane is always 120 columns wide (uploads are capped at 120 characters per line) and never
       shrinks. The argument panel sits to its right while the window has room, otherwise it wraps below. */
    .tool-layout { display: flex; flex-wrap: wrap; align-items: stretch; }
    /* the code column never shrinks; it grows only when it has a row to itself (grow 1 against the form's
       999), so a wrapped form leaves no dead space beside the code */
    .code-column {
        flex: 1 0 auto; display: flex; flex-direction: column;
        border-right: 1px solid var(--color-line); margin-right: -1px;
    }
    #code-scroll {
        width: auto; scrollbar-gutter: stable;   /* fills the column; the scrollbar never squeezes the code */
        max-height: 700px; overflow-y: auto; overflow-x: hidden;
    }
    /* 120 columns measured in the pre's own font (Chrome's ch runs a hair narrow, hence the 2-column slack),
       plus Prism's 3.8em line-number gutter and the 1em right padding */
    #code-scroll pre { width: calc(122ch + 3.8em + 1em); box-sizing: border-box; }
    #code-scroll pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    .args-column {
        flex: 999 1 18rem; min-width: 18rem;
        border-top: 1px solid var(--color-line); margin-top: -1px;
    }
    /* actions sit right under the argument tree, separated by a rule, instead of being pushed to the bottom */
    .args-actions {
        margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--color-line);
        display: flex; flex-direction: column; gap: 0.25rem;
    }
    .args-actions-row { display: flex; align-items: center; gap: 0.25rem; }
    .args-actions-row .label { margin-left: auto; }
    /* the argument tree as a `column -t` table: glyph | name: type | value. Values share one column that
       starts right after the longest label and are left-justified there, instead of sitting flush against
       the far edge of the panel where a wide window separates them from their names */
    #argument-form {
        display: grid; grid-template-columns: max-content max-content minmax(10ch, 1fr);
        column-gap: 0.5rem; align-items: center;
    }
    #argument-form > .font-bold { grid-column: 1 / -1; }
    #argument-form .tree-row { display: contents; }
    #argument-form .tree-row .field,
    #argument-form .tree-row .pick,
    #argument-form .tree-row label[id] {
        margin-left: 0; max-width: 100%; justify-self: start; justify-content: flex-start;
    }
    /* the pick and the [upload] label have hover padding; drop its left side so every value starts at
       the same pixel as the text fields */
    #argument-form .tree-row .pick,
    #argument-form .tree-row label[id] { padding-left: 0; }
    #argument-form .tree-row .field input { text-align: left; }
    #argument-form .tree-row .pick select { text-align: left; text-align-last: left; }
    /* result display: key/value and bullet rows, raw strings, [copy] brackets, embedded media */
    #result .result-tools { display: flex; justify-content: flex-end; margin-bottom: 0.25rem; }
    #result .copy { color: var(--color-dim); cursor: pointer; padding: 0 0.25rem; white-space: nowrap; }
    #result .copy:hover, #result .copy:focus-visible {
        background: var(--color-paper); color: var(--color-ink); outline: none;
    }
    #result .kv-table { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 1ch; }
    #result .cell { min-width: 0; }
    #result .cell .copy, #result .item .copy { margin-left: 0.5ch; }
    #result .kv { display: contents; }
    #result .key { color: var(--color-dim); white-space: nowrap; }
    #result .val { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
    #result .lit { color: var(--color-dim); }
    #result .item { display: flex; align-items: baseline; gap: 1ch; }
    #result .bullet { color: var(--color-dim); }
    #result .nest {
        grid-column: 1 / -1; margin-left: 1ch; padding-left: 1ch; border-left: 1px solid var(--color-line);
    }
    #result .item > .nest { flex: 1; margin-left: 0; }
    #result .preview { display: block; max-width: 100%; margin: 0.5em 0; }
    #result img.preview, #result video.preview { max-height: 60vh; }
    #result object.document { width: 100%; height: 70vh; }
    #result audio.preview { width: 100%; max-width: 40rem; }
</style>
